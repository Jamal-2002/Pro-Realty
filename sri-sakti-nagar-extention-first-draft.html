<style>
/* ============================================================
   SRI SAKTHI NAGAR EXTENSION — PRO REALTY'S
   Built by Spectre Imperium.
   Design system: survey-document editorial.
   Base palette is cool bone + survey ink + drawing blue, taken
   from CMDA layout drawings rather than from luxury real estate.
   ============================================================ */

:root{
  --paper:#F1F2EF;
  --sheet:#FFFFFF;
  --sheet-2:#E9EBE6;
  --ink:#14181C;
  --ink-2:#3A444C;
  --muted:#69737B;
  --line:#D2D6D0;
  --line-strong:#B6BCB6;
  --blue:#1E4A6D;
  --blue-2:#2C6796;
  --blue-wash:#E4ECF2;
  --green:#2E6B4F;
  --green-wash:#E2EDE6;
  --ochre:#8A6318;
  --ochre-wash:#F4EEDE;
  --red:#9E3520;

  --r:3px;
  --r-lg:6px;
  --maxw:1240px;
  --gut:clamp(20px,5vw,64px);

  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-ui:"Archivo","Helvetica Neue",Arial,sans-serif;

  --shadow:0 1px 2px rgba(20,24,28,.05),0 8px 24px -12px rgba(20,24,28,.18);
  --bar-h:0px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1417;
    --sheet:#151B20;
    --sheet-2:#1B2329;
    --ink:#E9ECE8;
    --ink-2:#BFC7C6;
    --muted:#8C979C;
    --line:#28323A;
    --line-strong:#3A4650;
    --blue:#8FBEDD;
    --blue-2:#A9D0E9;
    --blue-wash:#17252F;
    --green:#7FC0A0;
    --green-wash:#152520;
    --ochre:#D9B463;
    --ochre-wash:#26200F;
    --red:#E08B75;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1417; --sheet:#151B20; --sheet-2:#1B2329; --ink:#E9ECE8; --ink-2:#BFC7C6;
  --muted:#8C979C; --line:#28323A; --line-strong:#3A4650; --blue:#8FBEDD; --blue-2:#A9D0E9;
  --blue-wash:#17252F; --green:#7FC0A0; --green-wash:#152520; --ochre:#D9B463; --ochre-wash:#26200F; --red:#E08B75;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--f-ui);font-size:16px;line-height:1.55;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  padding-bottom:var(--bar-h);
}
img,svg{max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue-2);outline-offset:3px;border-radius:2px}

/* ---------- type ---------- */
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;letter-spacing:-.015em;margin:0;line-height:1.08}
h1{font-size:clamp(38px,6.2vw,74px);line-height:1.02;letter-spacing:-.03em}
h2{font-size:clamp(27px,3.4vw,42px)}
h3{font-size:clamp(20px,2.1vw,25px);line-height:1.2}
h4{font-family:var(--f-ui);font-weight:600;font-size:15px;letter-spacing:.005em;line-height:1.35}
p{margin:0 0 1em}
.lede{font-family:var(--f-display);font-size:clamp(18px,2.1vw,23px);line-height:1.5;color:var(--ink-2);max-width:60ch;font-weight:300}
.body{max-width:66ch;color:var(--ink-2)}
.small{font-size:13.5px;line-height:1.5;color:var(--muted)}
.tiny{font-size:12px;line-height:1.45;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mark{color:var(--blue)}

/* ---------- layout ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gut)}
.sec{padding-block:clamp(46px,6.5vw,92px);border-top:1px solid var(--line)}
.sec--flush{border-top:0}
.sec--tint{background:var(--sheet-2)}
.grid-idx{display:grid;grid-template-columns:170px minmax(0,1fr);gap:clamp(18px,4vw,56px);align-items:start}
@media (max-width:860px){.grid-idx{grid-template-columns:1fr;gap:14px}}
.idx{position:sticky;top:92px;font-size:12.5px;color:var(--muted);letter-spacing:.02em;line-height:1.4}
.idx b{display:block;color:var(--ink);font-weight:600;font-size:13px;letter-spacing:0}
@media (max-width:860px){.idx{position:static;display:flex;gap:8px;align-items:baseline;padding-bottom:2px;border-bottom:1px solid var(--line)}
  .idx b{display:inline}}
.stack>*+*{margin-top:clamp(20px,3vw,34px)}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(20px,3vw,40px)}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:clamp(16px,2.4vw,28px)}
.hr{height:1px;background:var(--line);border:0;margin:0}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:var(--maxw);margin:0 auto;padding:0 var(--gut);display:flex;align-items:center;gap:24px;height:66px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:0 0 auto}
.brand svg{width:26px;height:26px;flex:0 0 auto}
.brand-t{display:flex;flex-direction:column;line-height:1.05}
.brand-t span:first-child{font-family:var(--f-display);font-size:19px;letter-spacing:-.01em}
.brand-t span:last-child{font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.nav{display:flex;gap:22px;margin-left:auto;align-items:center}
.nav a{text-decoration:none;font-size:14px;color:var(--ink-2);padding:6px 0;border-bottom:1.5px solid transparent}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--blue)}
@media (max-width:1000px){.nav{display:none}}
.hdr .btn{margin-left:auto}
.nav+.btn{margin-left:6px}
.menu-btn{display:none;margin-left:auto;background:none;border:1px solid var(--line-strong);border-radius:var(--r);padding:8px 11px;cursor:pointer}
@media (max-width:1000px){.menu-btn{display:inline-flex;align-items:center;gap:8px;font-size:13.5px}
  .hdr .btn{display:none}}
.drawer{display:none;border-top:1px solid var(--line);background:var(--paper)}
.drawer.open{display:block}
.drawer a{display:block;padding:14px var(--gut);text-decoration:none;border-bottom:1px solid var(--line);font-size:16px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 20px;border-radius:var(--r);
  border:1px solid var(--blue);background:var(--blue);color:#fff;text-decoration:none;font-size:14.5px;font-weight:600;
  cursor:pointer;transition:background .16s ease,border-color .16s ease,color .16s ease;white-space:nowrap}
.btn:hover{background:var(--blue-2);border-color:var(--blue-2)}
:root[data-theme="dark"] .btn,.btn{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#0F1417}}
:root[data-theme="dark"] .btn{color:#0F1417}
.btn--ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn--ghost:hover{background:var(--sheet);border-color:var(--ink-2);color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn--ghost{color:var(--ink)}}
:root[data-theme="dark"] .btn--ghost{color:var(--ink)}
.btn--sm{padding:9px 14px;font-size:13.5px}
.btn--wide{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.lnk{color:var(--blue);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--blue) 40%,transparent);font-weight:500;font-size:14.5px}
.lnk:hover{border-bottom-color:var(--blue)}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- chips / notes ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.02em;
  padding:3px 8px;border-radius:100px;border:1px solid var(--line-strong);color:var(--muted);background:var(--sheet)}
.chip--ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 35%,transparent);background:var(--green-wash)}
.chip--sold{color:var(--muted);background:var(--sheet-2);border-color:var(--line)}
.chip--note{color:var(--ochre);border-color:color-mix(in srgb,var(--ochre) 35%,transparent);background:var(--ochre-wash)}
.chip--draft{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,transparent);background:transparent}
.note{border-left:2px solid var(--ochre);background:var(--ochre-wash);padding:12px 14px;border-radius:0 var(--r) var(--r) 0;font-size:13.5px;color:var(--ink-2);max-width:70ch}
.note b{color:var(--ink)}
.foot{font-size:12.5px;color:var(--muted);max-width:72ch}

/* ---------- data ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line-strong)}
.stat{padding:20px 18px 18px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .v{font-family:var(--f-display);font-size:clamp(28px,3.6vw,40px);line-height:1;letter-spacing:-.02em;display:block}
.stat .k{font-size:12.5px;color:var(--muted);margin-top:8px;display:block;max-width:20ch}
@media (max-width:700px){.stat{border-right:0}.stat:nth-child(odd){border-right:1px solid var(--line)}
  .stats{grid-template-columns:1fr 1fr}}

.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.card h3{margin-bottom:8px}

/* ---------- hero ---------- */
.hero{padding-block:clamp(34px,5vw,60px) clamp(30px,4vw,50px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);gap:clamp(24px,4vw,58px);align-items:end}
@media (max-width:940px){.hero-grid{grid-template-columns:1fr;align-items:start}}
.hero h1{margin-bottom:18px}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px 10px;margin:22px 0 24px}
.hero-facts{border-top:1px solid var(--line);margin-top:26px;padding-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:520px){.hero-facts{grid-template-columns:1fr 1fr}}
.hero-facts div{font-size:13px;color:var(--muted)}
.hero-facts b{display:block;font-family:var(--f-display);font-size:22px;color:var(--ink);font-weight:400;letter-spacing:-.01em}

/* ---------- plan drawing ---------- */
.plan-wrap{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 14px 10px;position:relative;overflow:hidden}
.plan-wrap::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:26px 26px;opacity:.28}
.plan-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;position:relative;margin-bottom:8px}
.plan-head .t{font-size:12.5px;color:var(--muted)}
.plan-svg{display:block;width:100%;height:auto;position:relative}
.plot-rect{cursor:pointer;transition:fill .12s ease,stroke .12s ease}
.plot-rect:focus-visible{outline:none;stroke:var(--blue-2);stroke-width:2.4}
.plot-lbl{font-family:var(--f-ui);font-size:8.5px;font-weight:600;pointer-events:none;fill:var(--ink-2)}
.road-lbl{font-family:var(--f-ui);font-size:7.5px;fill:var(--muted);letter-spacing:.04em;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;position:relative;font-size:12px;color:var(--muted)}
.legend i{width:11px;height:11px;display:inline-block;border-radius:2px;border:1px solid var(--line-strong);margin-right:6px;vertical-align:-1px}

/* ---------- inventory ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:16px;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-lg)}
.field{display:flex;flex-direction:column;gap:5px;min-width:130px;flex:1 1 130px}
.field label{font-size:12px;color:var(--muted)}
.field select,.field input,.field textarea{background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--r);padding:10px 11px;font-size:14.5px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
.field.err select,.field.err input{border-color:var(--red)}
.field .msg{font-size:12px;color:var(--red);min-height:0}
.result-bar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:16px 0 12px;font-size:13.5px;color:var(--muted)}

.plots{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:12px}
.plot{position:relative;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;cursor:pointer;
  transition:border-color .14s ease,transform .14s ease}
.plot:hover{border-color:var(--line-strong)}
.plot .no{font-family:var(--f-display);font-size:26px;letter-spacing:-.01em;line-height:1}
.plot .sz{margin-top:10px;font-size:19px;font-weight:600;letter-spacing:-.01em}
.plot .dm{font-size:13px;color:var(--muted);margin-top:2px}
.plot .rw{display:flex;gap:6px;align-items:center;margin-top:12px;flex-wrap:wrap}
.plot--sold{opacity:.62;cursor:default}
.plot--sold:hover{border-color:var(--line)}
.plot-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r-lg);padding:30px;text-align:center;color:var(--muted)}

/* ---------- band cards ---------- */
.band{border:1px solid var(--line);background:var(--sheet);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:10px}
.band .r{font-family:var(--f-display);font-size:30px;letter-spacing:-.02em;line-height:1}
.band h3{font-size:17px;font-family:var(--f-ui);font-weight:600}
.band .cnt{font-size:13px;color:var(--muted)}
.band ul{margin:0;padding-left:17px;font-size:13.5px;color:var(--ink-2)}
.band ul li{margin-bottom:4px}

/* ---------- distance scale ---------- */
.dist{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 16px 12px;overflow-x:auto}
.dist-row{display:grid;grid-template-columns:132px minmax(280px,1fr) 62px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.dist-row:last-child{border-bottom:0}
.dist-row .n{font-size:13.5px;line-height:1.25}
.dist-row .n small{display:block;color:var(--muted);font-size:11.5px}
.dist-row .v{font-size:14px;font-weight:600;text-align:right}
.track{position:relative;height:20px}
.track::before{content:"";position:absolute;left:0;right:0;top:9.5px;height:1px;background:var(--line)}
.track i{position:absolute;top:5px;width:9px;height:9px;border-radius:50%;background:var(--blue);transform:translateX(-4.5px)}
.axis{display:grid;grid-template-columns:132px minmax(280px,1fr) 62px;gap:12px;font-size:11.5px;color:var(--muted);padding-top:6px}
.axis .ticks{display:flex;justify-content:space-between}
@media (max-width:720px){.dist-row,.axis{grid-template-columns:118px minmax(150px,1fr) 54px;gap:8px}}

/* ---------- process ---------- */
.steps{counter-reset:s;display:grid;gap:0;border-top:1px solid var(--line)}
.step{display:grid;grid-template-columns:56px minmax(0,1fr);gap:16px;padding:18px 0;border-bottom:1px solid var(--line);align-items:start}
.step .s{font-family:var(--f-display);font-size:24px;color:var(--blue);line-height:1}
.step h4{margin-bottom:4px;font-size:16px}
.step p{margin:0;font-size:14.5px;color:var(--ink-2);max-width:62ch}

/* ---------- faq ---------- */
.faq{border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:16px 34px 16px 0;position:relative;font-size:16.5px;font-weight:500}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";position:absolute;right:6px;top:24px;width:9px;height:9px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .18s ease}
.faq details[open] summary::after{transform:rotate(-135deg)}
.faq .a{padding:0 0 18px;color:var(--ink-2);font-size:15px;max-width:70ch}
.faq .a p:last-child{margin-bottom:0}

/* ---------- estimator ---------- */
.est{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.est-out{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.est-out .v{font-family:var(--f-display);font-size:clamp(26px,3.4vw,36px);letter-spacing:-.02em;line-height:1.1}
.est-out .k{font-size:13px;color:var(--muted);margin-top:6px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:90;display:none}
.modal.open{display:block}
.modal .veil{position:absolute;inset:0;background:rgba(10,14,17,.5);backdrop-filter:blur(2px)}
.modal .panel{position:absolute;right:0;top:0;bottom:0;width:min(460px,100%);background:var(--paper);border-left:1px solid var(--line);
  overflow-y:auto;padding:22px var(--gut) 40px;box-shadow:var(--shadow);animation:slide .22s ease}
@keyframes slide{from{transform:translateX(18px);opacity:.4}to{transform:none;opacity:1}}
@media (max-width:560px){.modal .panel{width:100%;top:auto;bottom:0;height:88vh;border-left:0;border-top:1px solid var(--line);border-radius:var(--r-lg) var(--r-lg) 0 0;animation:up .22s ease}
  @keyframes up{from{transform:translateY(24px)}to{transform:none}}}
.modal-x{position:absolute;top:14px;right:14px;background:var(--sheet);border:1px solid var(--line-strong);border-radius:var(--r);width:34px;height:34px;cursor:pointer;font-size:17px;line-height:1}
.spec{border-top:1px solid var(--line);margin:16px 0}
.spec div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.spec span:first-child{color:var(--muted)}
.spec span:last-child{font-weight:600;text-align:right}

/* ---------- form ---------- */
.form{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(18px,3vw,28px)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.form-grid{grid-template-columns:1fr}}
.form-grid .full{grid-column:1/-1}
.ok{border:1px solid var(--green);background:var(--green-wash);border-radius:var(--r-lg);padding:22px}
.ok h3{color:var(--green);margin-bottom:8px}

/* ---------- mobile action bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;grid-template-columns:1fr 1fr 1.45fr;gap:1px;
  background:var(--line);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bar a{display:flex;align-items:center;justify-content:center;gap:7px;padding:14px 6px;background:var(--paper);
  text-decoration:none;font-size:14px;font-weight:600}
.bar a.pri{background:var(--blue);color:#fff}
@media (max-width:860px){.bar{display:grid}body{--bar-h:60px}}

/* ---------- footer ---------- */
.ftr{border-top:1px solid var(--line-strong);background:var(--sheet-2);padding-block:clamp(34px,4vw,54px) 30px}
.ftr-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:clamp(20px,3vw,40px)}
@media (max-width:760px){.ftr-grid{grid-template-columns:1fr 1fr}.ftr-grid>:first-child{grid-column:1/-1}}
.ftr a{display:block;text-decoration:none;color:var(--ink-2);font-size:14px;padding:4px 0}
.ftr a:hover{color:var(--ink)}
.ftr h4{margin-bottom:8px;font-size:13px;color:var(--muted);font-weight:500}

/* ---------- draft banner ---------- */
.draft{background:var(--ink);color:var(--paper);font-size:12.5px;padding:8px var(--gut);display:flex;gap:12px;align-items:center;justify-content:space-between}
.draft button{background:transparent;border:1px solid color-mix(in srgb,var(--paper) 40%,transparent);color:inherit;border-radius:var(--r);padding:4px 9px;cursor:pointer;font-size:12px}
.draft ul{margin:4px 0 0;padding-left:16px;opacity:.8}

.skip{position:absolute;left:-9999px;top:0;background:var(--ink);color:var(--paper);padding:10px 16px;z-index:100}
.skip:focus{left:8px;top:8px}
</style>
</head>

const $  = (s,r=document)=>r.querySelector(s);

const n  = v => Number(v).toLocaleString('en-IN');
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function inr(v){
  if(v>=1e7) return "₹"+(v/1e7).toFixed(2).replace(/\.00$/,'')+" Cr";
  if(v>=1e5) return "₹"+(v/1e5).toFixed(2).replace(/\.00$/,'')+" L";
  return "₹"+n(Math.round(v));
}
function priceRange(area){ return inr(area*CONFIG.priceMin)+" – "+inr(area*CONFIG.priceMax); }

/* UTM + referrer capture, preserved for the life of the session */
const UTM = (()=>{
  const keys=["utm_source","utm_medium","utm_campaign","utm_content","utm_term","gclid","fbclid"];
  let store={};
  try{ store=JSON.parse(sessionStorage.getItem("ssne_utm")||"{}"); }catch(e){}
  const q=new URLSearchParams(location.search);
  let touched=false;
  keys.forEach(k=>{ if(q.get(k)){ store[k]=q.get(k); touched=true; } });
  if(!store.landing_page){ store.landing_page=location.pathname+location.hash; touched=true; }
  if(!store.referrer){ store.referrer=document.referrer||"direct"; touched=true; }
  if(touched){ try{ sessionStorage.setItem("ssne_utm",JSON.stringify(store)); }catch(e){} }
  return store;
})();

/* Single analytics entry point. Wire GA4/Meta/GTM here, once. */
window.dataLayer = window.dataLayer || [];
function track(event, props){
  const payload = Object.assign({event, page:location.hash||"#/"}, UTM, props||{});

  window.dispatchEvent(new CustomEvent("ssne:track",{detail:payload}));
  if(CONFIG.debugEvents) console.debug("[track]",event,payload);
}

function parseHash(){
  const raw=(location.hash||"#/").slice(1);
  const [path,qs]=raw.split("?");
  return { path: (path||"/").replace(/\/$/,"")||"/", q: new URLSearchParams(qs||"") };
}

let currentQuery=new URLSearchParams();
function render(){
  const {path,q}=parseHash();
  currentQuery=q;
  const route=ROUTES[path]||ROUTES["/"];
  document.title=route.title;
  $("#main").innerHTML=route.render();
  $$("#nav a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")===("#"+path)?"page":"false"));
  $("#drawer").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded","false");
  wire();
  track("page_view",{path});
  if(!window.__firstPaint){ window.__firstPaint=true; } else { window.scrollTo({top:0,behavior:"auto"}); }
  const plot=q.get("plot"); if(plot&&path==="/plots") openPlot(plot);
}

const filters={band:"",facing:"",status:"available",sort:"idx"};

function filtered(){
  let list=PLOTS.filter(p=>
    (!filters.band||p.band===filters.band)&&
    (!filters.facing||p.facing===filters.facing)&&
    (!filters.status||p.status===filters.status));
  if(filters.sort==="asc") list=list.slice().sort((a,b)=>a.area-b.area);
  if(filters.sort==="desc") list=list.slice().sort((a,b)=>b.area-a.area);
  return list;
}

function paintGrid(){
  const grid=$("[data-plot-grid]"); if(!grid) return;
  const list=filtered();
  grid.innerHTML=list.length?list.map(plotCard).join('')
    :`<div class="empty" style="grid-column:1/-1"><p style="margin:0 0 12px">No plots match those filters right now.</p><button class="btn btn--ghost btn--sm" data-reset>Clear the filters</button></div>`;
  const c=$("[data-count]");
  if(c) c.textContent=list.length+" of "+PLOTS.length+" plots"+(filters.status==="available"?" · available only":"");
  paintPlanState();
}

/* --- the plan drawing --------------------------------------------------- */
function buildPlan(){
  const host=$("[data-plan-svg]"); if(!host) return;
  const perRow=7, gap=4, roadFt=13, pad=10;
  const rows=[]; for(let i=0;i<PLOTS.length;i+=perRow) rows.push(PLOTS.slice(i,i+perRow));
  const maxW=Math.max.apply(null,rows.map(r=>r.reduce((s,p)=>s+p.w,0)+gap*(r.length-1)));
  const VBW=1000, scale=(VBW-pad*2)/maxW;
  let y=pad, out="";
  rows.forEach((row,ri)=>{
    const h=Math.max.apply(null,row.map(p=>p.d))*scale;
    let x=pad;
    row.forEach(p=>{
      const w=p.w*scale, ph=p.d*scale;
      const int=p.status==="available";
      out+=`<g><rect class="plot-rect" data-rect="${p.id}" ${int?'tabindex="0" role="button"':''} aria-label="Plot ${p.id}, ${p.area} square feet, ${p.status}" x="${x.toFixed(1)}" y="${(y+h-ph).toFixed(1)}" width="${w.toFixed(1)}" height="${ph.toFixed(1)}" rx="1.5"></rect>`;
      if(w>26) out+=`<text class="plot-lbl" x="${(x+w/2).toFixed(1)}" y="${(y+h-ph/2+3).toFixed(1)}" text-anchor="middle">${p.id}</text>`;
      out+=`</g>`;
      x+=w+gap;
    });
    y+=h;
    if(ri<rows.length-1){
      out+=`<rect x="${pad}" y="${y.toFixed(1)}" width="${VBW-pad*2}" height="${(roadFt*scale).toFixed(1)}" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray="4 4"></rect>`;
      out+=`<text class="road-lbl" x="${pad+8}" y="${(y+roadFt*scale/2+2.6).toFixed(1)}">${ri%2?"20'":"24'"} ROAD</text>`;
      y+=roadFt*scale;
    }
  });
  host.innerHTML=`<svg class="plan-svg" viewBox="0 0 ${VBW} ${(y+pad).toFixed(0)}" role="img" aria-label="Schematic plan of the layout showing every plot">${out}</svg>`;
  paintPlanState();
}

function paintPlanState(){
  const ids=new Set(filtered().map(p=>p.id));
  $$("[data-rect]").forEach(r=>{
    const p=PLOTS.find(x=>x.id===r.dataset.rect);
    const on=ids.has(p.id)||!$("[data-plot-grid]");
    const sold=p.status==="sold";
    r.setAttribute("fill",sold?"var(--sheet-2)":"var(--green-wash)");
    r.setAttribute("stroke",sold?"var(--line-strong)":"var(--green)");
    r.setAttribute("stroke-width","1");
    r.style.opacity=on?1:.2;
    r.style.cursor=sold?"default":"pointer";
  });
  const c=$("[data-plan-count]");
  if(c) c.textContent=filtered().filter(p=>p.status==="available").length;
}

/* --- plot detail -------------------------------------------------------- */
function openPlot(id){
  const p=PLOTS.find(x=>x.id===id); if(!p||p.status==="sold") return;
  const b=BANDS.find(x=>x.id===p.band);
  $("#modalBody").innerHTML=`
    <span class="chip chip--ok">Available</span>
    <h2 id="modalTitle" style="margin:12px 0 4px">Plot ${esc(p.id)}</h2>
    <p class="small">${b.name} band · ${esc(CONFIG.project)}</p>
    <div class="spec">
      <div><span>Plot area</span><span>${n(p.area)} sq.ft.</span></div>
      <div><span>Dimensions</span><span>${p.w}' × ${p.d}'</span></div>
      <div><span>Facing</span><span>${FACING[p.facing]}</span></div>
      <div><span>Internal road</span><span>${CONFIG.roads}</span></div>
      <div><span>Survey reference</span><span>Per approved layout</span></div>
      <div><span>Planning permit</span><span>${esc(CONFIG.permits)}</span></div>
      <div><span>Indicative price</span><span>${priceRange(p.area)}</span></div>
    </div>
    <p class="tiny">Indicative only, at the current ₹${n(CONFIG.priceMin)}–₹${n(CONFIG.priceMax)} per sq.ft. range and excluding registration, stamp duty and other charges. The actual price for this plot is quoted on request.</p>
    ${p.note?`<div class="note" style="margin:14px 0"><b>Note on this plot.</b> ${esc(p.note)}</div>`:''}
    <div class="cta-row" style="margin-top:18px">
      <a class="btn btn--wide" href="#/book-site-visit?plot=${p.id}" data-nav data-track="cta_plot_visit" data-plot-id="${p.id}">Book a visit for Plot ${esc(p.id)}</a>
      <a class="btn btn--ghost btn--wide" href="${waLink("Hi, I'd like the price for Plot "+p.id+" ("+n(p.area)+" sq.ft.) at "+CONFIG.project+".")}" target="_blank" rel="noopener" data-track="cta_plot_price">Get the price on WhatsApp</a>
      <a class="btn btn--ghost btn--wide" href="${telLink()}" data-track="cta_plot_call">Call about this plot</a>
    </div>
    <p class="tiny" style="margin-top:14px">Dimensions and facing to be verified at site before purchase.</p>`;
  $("#modal").classList.add("open");
  document.body.style.overflow="hidden";
  $("#modal .modal-x").focus();
  track("plot_selected",{plot:p.id,area:p.area,band:p.band,facing:p.facing});
}
function closeModal(){ $("#modal").classList.remove("open"); document.body.style.overflow=""; }

/* ==========================================================================
   9. LEAD SYSTEM
   ========================================================================== */
function validate(form){
  let ok=true;
  const need=[["name","Tell us what to call you."],["phone","We need a number to confirm the visit."],
              ["requirement","Pick a size, or choose 'Not sure yet'."],["purpose","Pick one, or choose 'Not sure yet'."]];
  need.forEach(([k,msg])=>{
    const el=form.querySelector(`[name="${k}"]`); const wrap=el.closest(".field"); const out=wrap.querySelector(".msg");
    let bad=!el.value.trim();
    if(k==="phone"&&el.value.trim()&&el.value.replace(/\D/g,'').length<10) bad=true;
    wrap.classList.toggle("err",bad);
    if(out) out.textContent=bad?(k==="phone"&&el.value.trim()?"That number looks short. Check the digits.":msg):"";
    if(bad&&ok){ el.focus(); ok=false; }
    else if(bad) ok=false;
  });
  return ok;
}

async function submitLead(form,btn){
  if(!validate(form)){ track("form_error",{}); return; }
  const data={};
  $$("[name]",form).forEach(el=>data[el.name]=el.value.trim());
  const lead=Object.assign({
    project:CONFIG.project, submitted_at:new Date().toISOString(),
    page:location.hash, source:"website"
  },UTM,data);

  btn.disabled=true; btn.textContent="Booking…";
  let delivered=false;
  if(CONFIG.leadEndpoint){
    try{
      const r=await fetch(CONFIG.leadEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(lead)});
      delivered=r.ok;
    }catch(e){ delivered=false; }
  }
  try{
    const held=JSON.parse(localStorage.getItem("ssne_leads")||"[]");
    held.push(lead); localStorage.setItem("ssne_leads",JSON.stringify(held));
  }catch(e){}

  track("site_visit_requested",{requirement:lead.requirement,purpose:lead.purpose,plot:lead.plot||"none",delivered});

  const wa=waLink(`Site visit request — ${CONFIG.project}\nName: ${lead.name}\nPhone: ${lead.phone}\nSize: ${lead.requirement}\nPurpose: ${lead.purpose}${lead.plot?`\nPlot: ${lead.plot}`:''}${lead.date?`\nPreferred: ${lead.date} ${lead.time||''}`:''}`);
  form.outerHTML=`<div class="ok">
    <h3>Booked. We'll call to confirm.</h3>
    <p class="small" style="margin-bottom:14px">Thanks ${esc(lead.name.split(" ")[0])}. Someone from the team will call ${esc(lead.phone)} to fix the date, time and pickup if you need it.${delivered?"":" If you'd rather not wait, send the same details on WhatsApp now."}</p>
    <div class="cta-row"><a class="btn btn--sm" href="${wa}" target="_blank" rel="noopener" data-track="cta_confirm_whatsapp">Send it on WhatsApp</a>
    <a class="btn btn--ghost btn--sm" href="${telLink()}" data-track="cta_confirm_call">Call now</a>
    <a class="btn btn--ghost btn--sm" href="#/plots" data-nav>Keep looking at plots</a></div>
    ${!CONFIG.leadEndpoint?`<p class="tiny" style="margin:14px 0 0">Build note: leadEndpoint is not set, so this submission is held in this browser only. Set it in CONFIG before launch.</p>`:''}
  </div>`;
}

/* ==========================================================================
   10. WIRING
   ========================================================================== */
function wire(){
  buildPlan();

  const fw=$("[data-filters]");
  if(fw){
    const band=currentQuery.get("band");
    if(band&&BANDS.some(b=>b.id===band)) filters.band=band;
    $$("[data-f]",fw).forEach(sel=>{
      sel.value=filters[sel.dataset.f];
      sel.addEventListener("change",()=>{
        filters[sel.dataset.f]=sel.value;
        track("filter_changed",{filter:sel.dataset.f,value:sel.value});
        paintGrid();
      });
    });
    paintGrid();
  }

  const est=$("[data-est]");
  if(est){
    const inp=$("[data-est-input]",est), out=$("[data-est-out]",est);
    inp.addEventListener("input",()=>{
      const v=Math.max(0,Number(inp.value)||0);
      out.textContent=v?priceRange(v):"—";
    });
    inp.addEventListener("change",()=>track("price_estimated",{size:Number(inp.value)||0}));
  }

  const form=$("[data-form]");
  if(form){
    const d=$("#l-date",form); if(d) d.min=new Date().toISOString().slice(0,10);
    const plotSel=$("#l-plot",form);
    const pre=currentQuery.get("plot");
    if(plotSel&&pre) plotSel.value=pre;
    let started=false;
    form.addEventListener("input",()=>{ if(!started){ started=true; track("form_started",{}); } },{once:false});
    $("[data-submit]",form).addEventListener("click",e=>{ e.preventDefault(); submitLead(form,e.currentTarget); });
    form.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.tagName!=="TEXTAREA"){ e.preventDefault(); $("[data-submit]",form).click(); } });
  }

  $$("details",$("#main")).forEach(dt=>dt.addEventListener("toggle",()=>{ if(dt.open) track("faq_opened",{q:dt.querySelector("summary").textContent}); }));
}

/* delegated events */
document.addEventListener("click",e=>{
  const rect=e.target.closest("[data-rect]");
  if(rect){ openPlot(rect.dataset.rect); return; }
  const card=e.target.closest("[data-plot]");
  if(card){ openPlot(card.dataset.plot); return; }
  if(e.target.closest("[data-close]")){ closeModal(); return; }
  if(e.target.closest("[data-reset]")){
    Object.assign(filters,{band:"",facing:"",status:"available",sort:"idx"});
    $$("[data-f]").forEach(s=>s.value=filters[s.dataset.f]);
    paintGrid(); return;
  }
  const nav=e.target.closest("[data-nav]");
  if(nav){ closeModal(); }
  const t=e.target.closest("[data-track]");
  if(t) track(t.dataset.track,{label:t.textContent.trim().slice(0,60),plot:t.dataset.plotId||""});
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeModal();
  const rect=e.target.closest&&e.target.closest("[data-rect]");
  if(rect&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); openPlot(rect.dataset.rect); }
});
window.addEventListener("hashchange",render);
